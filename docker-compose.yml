# TrustGate on Oracle Database 23ai Free.
#   docker compose up --build      then open http://localhost:8080
# Values below are demo defaults; override them with environment variables or a .env file.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OracleAdmin_1}
      APP_USER: trustgate
      APP_USER_PASSWORD: ${TG_DB_PASSWORD:-TrustGate_1}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - oracle-data:/opt/oracle/oradata

  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      TG_DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      TG_DB_USER: trustgate
      TG_DB_PASSWORD: ${TG_DB_PASSWORD:-TrustGate_1}
      TG_KEK_PASSWORD: ${TG_KEK_PASSWORD:-change-me-kek}
      TG_CLIENT_PORTAL_SECRET: ${TG_CLIENT_PORTAL_SECRET:-portal-demo-secret}
      TG_CLIENT_MAIL_SECRET: ${TG_CLIENT_MAIL_SECRET:-mail-demo-secret}
      TG_ISSUER: http://localhost:8080/idp
      TG_SP_BASE: http://localhost:8080
      TG_DEMO_MODE: ${TG_DEMO_MODE:-true}
    ports:
      - "127.0.0.1:8080:8080"   # this PC only
    volumes:
      - app-data:/data

volumes:
  oracle-data:
  app-data:
